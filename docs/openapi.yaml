openapi: 3.0.3
info:
  title: FairPlay Africa - Content Registration API
  description: >
    A simple API that lets a user register an account, register a piece of
    content, and retrieve the content they've registered.
  version: 1.0.0
servers:
  - url: /api
tags:
  - name: Auth
  - name: Content

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive a JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /content:
    post:
      tags: [Content]
      summary: Register a new piece of content owned by the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentInput"
      responses:
        "201":
          description: Content registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    $ref: "#/components/schemas/Content"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Content]
      summary: Retrieve a paginated list of the authenticated user's registered content
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/ContentType"
      responses:
        "200":
          description: A page of content owned by the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Content"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /content/{id}:
    get:
      tags: [Content]
      summary: Retrieve a single piece of registered content by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested content
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    $ref: "#/components/schemas/Content"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Content not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ContentType:
      type: string
      enum: [ARTICLE, VIDEO, IMAGE, AUDIO, OTHER]

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
        token:
          type: string

    CreateContentInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/ContentType"
        url:
          type: string
          format: uri

    Content:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/ContentType"
        url:
          type: string
          nullable: true
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            details:
              type: object
              nullable: true
